<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E...%3C/svg%3E">
<title>TRADR. — Position Size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#121110;
    --surface-2:#17150f;
    --line:rgba(201,168,76,0.14);
    --line-strong:rgba(201,168,76,0.32);
    --gold:#c9a84c;
    --gold-soft:#8a7340;
    --text:#ede9df;
    --text-dim:#8f8b81;
    --text-faint:#5c584f;
    --warn:#c9784c;
    --ok:#8fae6f;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,168,76,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold);color:#0a0a0a;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- shell ---------- */
  .shell{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:22px;
    margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-weight:700;
    letter-spacing:0.02em;
    font-size:19px;
  }
  .brand .mark .dot{color:var(--gold);}
  .brand .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .cursor{
    display:inline-block;
    width:7px;height:13px;
    background:var(--gold);
    margin-left:2px;
    animation:blink 1.1s steps(1) infinite;
    vertical-align:-2px;
  }
  @keyframes blink{50%{opacity:0;}}
  .clock{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.06em;
    text-align:right;
  }

  /* ---------- control panel ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:30px;
    position:relative;
  }
  .panel::before{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;
    width:2px;
    background:linear-gradient(180deg,var(--gold),transparent);
  }
  .panel-grid{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:22px;
    align-items:end;
  }
  .field label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:9px;
  }
  .risk-input{
    display:flex;
    align-items:center;
    border:1px solid var(--line-strong);
    background:var(--surface-2);
    border-radius:var(--radius);
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .risk-input:focus-within{border-color:var(--gold);}
  .risk-input .prefix{
    padding:0 12px;
    font-family:'Space Mono',monospace;
    color:var(--gold-soft);
    font-size:15px;
    border-right:1px solid var(--line);
    align-self:stretch;
    display:flex;
    align-items:center;
  }
  .risk-input input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:19px;
    padding:12px 12px;
  }
  .unit-toggle{
    display:flex;
    border:1px solid var(--line);
  }
  .unit-toggle button{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    background:transparent;
    color:var(--text-dim);
    border:none;
    padding:0 14px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .unit-toggle button.active{
    background:var(--gold);
    color:#0a0a0a;
    font-weight:700;
  }
  .stop-row{display:flex;gap:0;}
  .stop-row .risk-input{flex:1;border-right:none;border-top-right-radius:0;border-bottom-right-radius:0;}
  .stop-row .unit-toggle{border-top-left-radius:0;border-bottom-left-radius:0;height:100%;}
  .stop-row .unit-toggle button{height:100%;}

  .add-field{display:flex;flex-direction:column;}
  .add-select{
    position:relative;
  }
  select.add-btn{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:1px dashed var(--line-strong);
    color:var(--gold);
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    padding:12px 34px 12px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    outline:none;
    min-width:190px;
  }
  select.add-btn:hover{border-color:var(--gold);}
  .add-select::after{
    content:'+';
    position:absolute;
    right:14px;top:50%;
    transform:translateY(-50%);
    color:var(--gold);
    font-size:15px;
    pointer-events:none;
  }
  select.add-btn option{background:var(--surface);color:var(--text);}

  /* ---------- cards grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    position:relative;
    transition:border-color .2s ease, transform .2s ease;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card:hover{border-color:var(--line-strong);}
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .sym{
    font-family:'Space Mono',monospace;
    font-size:22px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.02em;
  }
  .name{
    font-size:12px;
    color:var(--text-dim);
    margin-top:3px;
  }
  .remove{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:16px;
    cursor:pointer;
    line-height:1;
    padding:2px 4px;
    transition:color .15s ease;
  }
  .remove:hover{color:var(--warn);}

  .custom-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .custom-fields label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:4px;
  }
  .custom-fields input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:13px;
    padding:7px 8px;
    border-radius:var(--radius);
    outline:none;
  }
  .custom-fields input:focus{border-color:var(--gold);}

  .result{
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .contracts-line{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .contracts-num{
    font-family:'Space Mono',monospace;
    font-size:40px;
    font-weight:700;
    line-height:1;
    color:var(--text);
  }
  .contracts-label{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .risk-bar-wrap{
    margin-top:12px;
  }
  .risk-bar{
    height:5px;
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .risk-bar .fill{
    height:100%;
    background:var(--gold);
    transition:width .25s ease;
  }
  .risk-bar.over .fill{background:var(--warn);}
  .risk-meta{
    display:flex;
    justify-content:space-between;
    margin-top:6px;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
  }
  .risk-meta .amt{color:var(--text);}

  .spec-line{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:0.02em;
  }

  .hint{
    font-size:11px;
    color:var(--warn);
    line-height:1.4;
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--text-dim);
    font-family:'Space Mono',monospace;
    font-size:12px;
    border:1px dashed var(--line);
  }
  .empty a{color:var(--gold);cursor:pointer;text-decoration:underline;}

  footer{
    margin-top:40px;
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:0.06em;
  }

  @media (max-width:720px){
    .panel-grid{grid-template-columns:1fr;}
    select.add-btn{width:100%;}
    .contracts-num{font-size:34px;}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <span class="mark">TRADR<span class="dot">.</span></span>
      <span class="sub">position size</span>
    </div>
    <div class="clock">
      EVEN-LOT SIZING<span class="cursor"></span>
    </div>
  </header>

  <div class="panel">
    <div class="panel-grid">
      <div class="field">
        <label for="riskInput">Risk (USD)</label>
        <div class="risk-input">
          <span class="prefix">$</span>
          <input id="riskInput" type="number" inputmode="decimal" min="0" step="1" value="250">
        </div>
      </div>

      <div class="field">
        <label for="stopInput">Stop-loss</label>
        <div class="stop-row">
          <div class="risk-input">
            <input id="stopInput" type="number" inputmode="decimal" min="0" step="0.25" value="10">
          </div>
          <div class="unit-toggle" id="unitToggle">
            <button data-unit="ticks" class="active">TICKS</button>
            <button data-unit="points">PTS</button>
          </div>
        </div>
      </div>

      <div class="field add-field">
        <label>Add contract</label>
        <div class="add-select">
          <select class="add-btn" id="addSelect">
            <option value="" selected disabled>Select market…</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="grid" id="cardsGrid"></div>

  <footer>tick specs are exchange-standard &amp; may change — verify against CME Group before sizing size · this tool is educational, not financial advice</footer>
</div>

<script>
const CONTRACTS = [
  {sym:'MES', name:'Micro E-mini S&P 500',      tick:0.25,     value:1.25,   group:'Equity Index'},
  {sym:'MNQ', name:'Micro E-mini Nasdaq-100',   tick:0.25,     value:0.50,   group:'Equity Index'},
  {sym:'ES',  name:'E-mini S&P 500',            tick:0.25,     value:12.50,  group:'Equity Index'},
  {sym:'NQ',  name:'E-mini Nasdaq-100',         tick:0.25,     value:5.00,   group:'Equity Index'},
  {sym:'MYM', name:'Micro E-mini Dow',          tick:1,        value:0.50,   group:'Equity Index'},
  {sym:'YM',  name:'E-mini Dow',                tick:1,        value:5.00,   group:'Equity Index'},
  {sym:'M2K', name:'Micro E-mini Russell 2000', tick:0.10,     value:0.50,   group:'Equity Index'},
  {sym:'RTY', name:'E-mini Russell 2000',       tick:0.10,     value:5.00,   group:'Equity Index'},
  {sym:'MCL', name:'Micro WTI Crude Oil',       tick:0.01,     value:1.00,   group:'Energy'},
  {sym:'CL',  name:'WTI Crude Oil',             tick:0.01,     value:10.00,  group:'Energy'},
  {sym:'NG',  name:'Henry Hub Natural Gas',     tick:0.001,    value:10.00,  group:'Energy'},
  {sym:'MGC', name:'Micro Gold',                tick:0.10,     value:1.00,   group:'Metals'},
  {sym:'GC',  name:'Gold',                      tick:0.10,     value:10.00,  group:'Metals'},
  {sym:'SI',  name:'Silver',                    tick:0.005,    value:25.00,  group:'Metals'},
  {sym:'HG',  name:'Copper',                    tick:0.0005,   value:12.50,  group:'Metals'},
  {sym:'ZB',  name:'30-Year T-Bond',            tick:0.03125,  value:31.25,  group:'Rates'},
  {sym:'ZN',  name:'10-Year T-Note',            tick:0.015625, value:15.625, group:'Rates'},
  {sym:'6E',  name:'Euro FX',                   tick:0.00005,  value:6.25,   group:'FX'},
  {sym:'6B',  name:'British Pound',             tick:0.0001,   value:6.25,   group:'FX'},
  {sym:'6A',  name:'Australian Dollar',         tick:0.0001,   value:10.00,  group:'FX'},
  {sym:'MBT', name:'Micro Bitcoin',             tick:5,        value:0.50,   group:'Crypto'},
];

const state = {
  riskUSD: 250,
  stopValue: 30,
  stopUnit: 'points',
  cards: [
    {...CONTRACTS.find(c=>c.sym==='MES'), id:'MES'},
    {...CONTRACTS.find(c=>c.sym==='MNQ'), id:'MNQ'},
    {...CONTRACTS.find(c=>c.sym==='M2K'), id:'M2K'},
  ]
};

const $ = sel => document.querySelector(sel);
const grid = $('#cardsGrid');
const addSelect = $('#addSelect');

// populate add-select grouped by category
(function buildAddSelect(){
  const groups = {};
  CONTRACTS.forEach(c=>{
    groups[c.group] = groups[c.group] || [];
    groups[c.group].push(c);
  });
  Object.keys(groups).forEach(g=>{
    const og = document.createElement('optgroup');
    og.label = g;
    groups[g].forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c.sym;
      opt.textContent = `${c.sym} — ${c.name}`;
      og.appendChild(opt);
    });
    addSelect.appendChild(og);
  });
  const og2 = document.createElement('optgroup');
  og2.label = 'Other';
  const custom = document.createElement('option');
  custom.value = 'CUSTOM';
  custom.textContent = 'Custom contract…';
  og2.appendChild(custom);
  addSelect.appendChild(og2);
})();

addSelect.addEventListener('change', e=>{
  const val = e.target.value;
  if(!val) return;
  if(val === 'CUSTOM'){
    state.cards.push({sym:'', name:'Custom', tick:0.25, value:1.25, id:'c'+Date.now(), custom:true});
  } else {
    const base = CONTRACTS.find(c=>c.sym===val);
    state.cards.push({...base, id:val+'_'+Date.now()});
  }
  e.target.value = '';
  render();
});

$('#riskInput').addEventListener('input', e=>{
  state.riskUSD = parseFloat(e.target.value) || 0;
  render();
});
$('#stopInput').addEventListener('input', e=>{
  state.stopValue = parseFloat(e.target.value) || 0;
  render();
});
$('#unitToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  state.stopUnit = btn.dataset.unit;
  document.querySelectorAll('#unitToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

function calc(card){
  const tick = parseFloat(card.tick) || 0;
  const value = parseFloat(card.value) || 0;
  if(tick<=0 || value<=0 || state.stopValue<=0){
    return {even:0, riskPerContract:0, actualRisk:0, pct:0, raw:0, invalid:true};
  }
  const stopTicks = state.stopUnit === 'ticks' ? state.stopValue : state.stopValue / tick;
  const riskPerContract = stopTicks * value;
  const raw = riskPerContract>0 ? state.riskUSD / riskPerContract : 0;
  const even = Math.max(0, Math.floor(raw/2)*2);
  const actualRisk = even * riskPerContract;
  const pct = state.riskUSD>0 ? (actualRisk/state.riskUSD)*100 : 0;
  return {even, riskPerContract, actualRisk, pct, raw, invalid:false};
}

function fmt(n, d=2){
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
}

function render(){
  const active = document.activeElement;
  const focusInfo = (active && active.dataset && active.dataset.cid)
    ? {cid:active.dataset.cid, field:active.dataset.field, pos:active.selectionStart}
    : null;

  grid.innerHTML = '';

  if(state.cards.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `no contracts on the board · <a id="resetLink">restore MES / MNQ</a>`;
    grid.appendChild(empty);
    empty.querySelector('#resetLink').addEventListener('click', ()=>{
      state.cards = [
        {...CONTRACTS.find(c=>c.sym==='MES'), id:'MES_'+Date.now()},
        {...CONTRACTS.find(c=>c.sym==='MNQ'), id:'MNQ_'+Date.now()},
        {...CONTRACTS.find(c=>c.sym==='MNQ'), id:'M2K_'+Date.now()},
      ];
      render();
    });
    return;
  }

  state.cards.forEach(card=>{
    const r = calc(card);
    const el = document.createElement('div');
    el.className = 'card';

    let customFieldsHtml = '';
    if(card.custom){
      customFieldsHtml = `
        <div class="custom-fields">
          <div>
            <label>Symbol</label>
            <input type="text" class="cf-sym" data-cid="${card.id}" data-field="sym" value="${card.sym||''}" placeholder="e.g. NKD" maxlength="6">
          </div>
          <div>
            <label>Name</label>
            <input type="text" class="cf-name" data-cid="${card.id}" data-field="name" value="${card.name||''}" placeholder="Custom market">
          </div>
          <div>
            <label>Tick size</label>
            <input type="number" step="any" class="cf-tick" data-cid="${card.id}" data-field="tick" value="${card.tick}">
          </div>
          <div>
            <label>Tick value ($)</label>
            <input type="number" step="any" class="cf-value" data-cid="${card.id}" data-field="value" value="${card.value}">
          </div>
        </div>`;
    }

    let hintHtml = '';
    if(!r.invalid){
      if(r.even === 0 && r.raw >= 1){
        hintHtml = `<div class="hint">only 1 contract fits this risk budget — not even. widen risk or tighten stop.</div>`;
      } else if(r.raw < 1){
        hintHtml = `<div class="hint">stop-loss risk exceeds budget even at 1 contract.</div>`;
      }
    } else {
      hintHtml = `<div class="hint">enter tick size &amp; tick value.</div>`;
    }

    const overBudget = r.actualRisk > state.riskUSD + 0.001;

    el.innerHTML = `
      <div class="card-head">
        <div>
          <div class="sym">${card.custom ? (card.sym || '—') : card.sym}</div>
          <div class="name">${card.name}</div>
        </div>
        <button class="remove" title="Remove" aria-label="Remove ${card.sym}">&times;</button>
      </div>

      ${customFieldsHtml}

      <div class="result">
        <div class="contracts-line">
          <span class="contracts-num mono">${r.even}</span>
          <span class="contracts-label">contracts</span>
        </div>
        <div class="risk-bar-wrap">
          <div class="risk-bar ${overBudget ? 'over' : ''}">
            <div class="fill" style="width:${Math.min(100, r.pct)}%;"></div>
          </div>
          <div class="risk-meta">
            <span>risked <span class="amt mono">$${fmt(r.actualRisk)}</span></span>
            <span class="mono">${r.pct.toFixed(0)}%</span>
          </div>
        </div>
        ${hintHtml}
      </div>

      <div class="spec-line">tick ${card.tick} = $${fmt(card.value)} · $${fmt(r.riskPerContract)}/contract</div>
    `;

    el.querySelector('.remove').addEventListener('click', ()=>{
      state.cards = state.cards.filter(c=>c.id !== card.id);
      render();
    });

    if(card.custom){
      el.querySelector('.cf-sym').addEventListener('input', e=>{
        card.sym = e.target.value.toUpperCase();
        render();
      });
      el.querySelector('.cf-name').addEventListener('input', e=>{
        card.name = e.target.value || 'Custom';
        render();
      });
      el.querySelector('.cf-tick').addEventListener('input', e=>{
        card.tick = parseFloat(e.target.value) || 0;
        render();
      });
      el.querySelector('.cf-value').addEventListener('input', e=>{
        card.value = parseFloat(e.target.value) || 0;
        render();
      });
    }

    grid.appendChild(el);
  });

  if(focusInfo){
    const sel = `[data-cid="${focusInfo.cid}"][data-field="${focusInfo.field}"]`;
    const target = document.querySelector(sel);
    if(target){
      target.focus();
      if(target.setSelectionRange && target.type === 'text'){
        try{ target.setSelectionRange(focusInfo.pos, focusInfo.pos); }catch(_e){}
      }
    }
  }
}

render();
</script>
</body>
</html>
